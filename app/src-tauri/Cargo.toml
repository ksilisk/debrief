[package]
name = "debrief-app"
description = "Debrief desktop app: the Tauri shell around the Svelte window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "debrief_app"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
chrono.workspace = true
debrief-capture.workspace = true
debrief-core.workspace = true
debrief-summarize.workspace = true
debrief-transcribe.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
serde.workspace = true
# tauri::generate_context! uses it once tauri.conf.json has plugin settings.
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = ["NSFileManager"] }
