[workspace]
resolver = "3"
members = ["crates/core", "crates/capture", "crates/transcribe", "crates/summarize", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ksilisk/debrief"

[workspace.dependencies]
# Internal crates
debrief-core = { path = "crates/core" }
debrief-capture = { path = "crates/capture" }
debrief-summarize = { path = "crates/summarize" }
debrief-transcribe = { path = "crates/transcribe" }

# Shared external crates. Add new ones here and use `name.workspace = true` in member crates.
anyhow = "1.0.104"
block2 = "0.6.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
hound = "3.5.1"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVAsset",
    "AVAssetExportSession",
    "AVAssetTrack",
    "AVComposition",
    "AVCompositionTrack",
    "AVMediaFormat",
    "block2",
    "objc2-core-media",
] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "AudioHardware",
    "HostTime",
    "block2",
    "dispatch2",
    "objc2",
    "objc2-core-audio-types",
    "objc2-foundation",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes", "objc2"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMTime", "CMTimeRange"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSUUID",
    "NSValue",
] }
# Pinned exactly: this crate releases breaking versions often.
screencapturekit = { version = "=11.1.2", features = ["macos_15_0"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
rpassword = "7.5.4"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"
whisper-rs = "0.16.0"
